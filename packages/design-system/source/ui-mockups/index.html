function drawerContent(view){
 if(view==='editor'){

 }
 if(view==='theme'){const id=location.hash.split('/')[1],a=themeArtifacts.get(id);return `<h3>${drawerTab==='Preferences'?'Preview & save':'Theme context'}</h3><dl><dt>Personal preview</dt><dd>${esc(id)} · ${esc(a?.theme.name||'Unavailable')}</dd><dt>Applied palette</dt><dd>${esc(appliedTheme.name)}</dd><dt>Scope</dt><dd>Your browser appearance across workspaces; no organization default changes.</dd></dl><p>Colors preview live. Apply validates and saves your personal palette; Cancel restores the applied appearance. Back keeps the preview draft in page memory.</p><p>Custom CSS supports only the listed tokens and scoped chat-content rules. Invalid edits are rejected, not silently stripped.</p><div class="notice">Simulated theme assistant. No workflow, report or business action runs here.</div>`;}
 if(view==='settings'){

 }

 if(drawerTab==='Attention')return attentionPanel(visibleItems());
 if(view==='desk')return `${scopeSummary()}<dl><dt>Needs attention</dt><dd>${visibleItems().length} sample items</dd><dt>Running work</dt><dd>${visibleRuns().length} sample workflows</dd><dt>Source freshness</dt><dd>Fictional snapshots as of 09:42; no live sync.</dd></dl><p>Use Attention to find a decision, Agents to inspect sampled activity, or Actions to review selected targets.</p><div class="notice">Each organization keeps its own work and action destinations.</div>`;
 const ids=chatArtifacts(),flow=flowByChat[current.id];
 if(drawerTab==='Reports')return ids.filter(id=>id!=='receipt').map(id=>`<button class="related" data-open="${id}"><strong>${esc(artifacts[id].title)}</strong><span class="small">${esc(artifacts[id].kind)} · local draft · open editor</span></button>`).join('')||'<p>No report or dashboard has been attached to this conversation.</p>';
 if(drawerTab==='Analysis')return ids.includes('receipt')?'<button class="related" data-open="receipt"><strong>Why BUG-208 stopped</strong><span class="small">AR-441 · missing regression evidence</span></button><p>No live reevaluation or approval is available.</p>':'<p>No analysis artifact is attached to this conversation. Sample messages are not executed checks.</p>';

function renderDrawer(){const d=$('#drawer'),view=drawerView(),sections=drawerSections(view);if(!sections.includes(drawerTab))drawerTab='Context';d.hidden=!drawerOpen;d.inert=false;$('#context-toggle').setAttribute('aria-expanded',String(drawerOpen));$('#context-toggle').setAttribute('aria-label',drawerOpen?'Close tools drawer':'Open tools drawer');$('#context-toggle').title=drawerOpen?'Close tools drawer':'Open tools drawer';$('#context-toggle .drawer-arrow').textContent=drawerOpen?'›':'‹';$('#app').classList.toggle('drawer-open',drawerOpen);$('#editor').classList.toggle('drawer-open',drawerOpen);if(!drawerOpen)return;const title={desk:'Your work',chat:'This conversation',admin:'Admin context',settings:'Settings context',editor:'Artifact context',theme:'Personal theme'}[view];d.setAttribute('aria-label',title);d.innerHTML=`<div class="drawer-heading"><h2>${title}</h2><button class="quiet" data-close-context aria-label="Close tools drawer">×</button></div><label class="drawer-section-label" for="drawer-section">${view==='editor'?'Artifact tools':'Page tools'}</label><select class="drawer-section" id="drawer-section" aria-controls="drawer-content">${sections.map(t=>`<option ${drawerTab===t?'selected':''}>${t}</option>`).join('')}</select><div id="drawer-content" role="region" aria-label="${esc(drawerTab)}">${drawerContent(view)}</div>`;}

function openEditor(id){if(!available()||!Object.hasOwn(artifacts,id)){toast('This artifact is not available in the current workspace.');return;}editorOrigin=location.hash.startsWith('#editor/')?editorOrigin:location.hash;edit=null;navigate('#editor/'+id+'?chat='+encodeURIComponent(current.id));}

tyle="margin-top:18px">Cancel discards these edits. Back keeps them here until you return or reload.</p></div>`;$('#editor').append($('#drawer'),$('#context-toggle'));renderDrawer();$('#editor [data-cancel]').focus();}
function closeEditor(){parkDrawer();if(edit)returnArtifact=edit.id;edit=null;$('#editor').hidden=true;$('#app').inert=false;$('#drawer').inert=false;}
function saveEditor(){const a=artifacts[edit.id],title=edit.id==='receipt'?a.title:$('#edit-title').value.trim(),body=$('#edit-body').value;if(!title){$('#save-error').textContent='Add a title before saving.';$('#edit-title').focus();return;}const next={...a,title,body,revision:a.revision+1};if(edit.id==='dashboard'){next.showMetrics=$('#show-metrics').checked;next.showActivity=$('#show-activity').checked;}try{localStorage.setItem(storageKey,JSON.stringify({version:2,artifacts:{...artifacts,[a.id]:next}}));}catch{$('#save-error').innerHTML='<div class="receipt">This browser could not save the draft. Your edits are still here. Try again or cancel.</div>';return;}artifacts[a.id]=next;transientDrafts.delete(a.id);const origin=editorOrigin||'#chat/'+current.id;closeEditor();navigate(origin);toast('Draft saved in this browser. No live action was taken.');}

function parsePersonalCSS(css){const tokens={},rules=[];let rest=css;const selectors={'.card':'#main .artifact','.message':'#main .message','.button':'#main .artifact button'};rest=rest.replace(/\.(card|message|button)\s*\{([^{}]*)\}/g,(all,name,body)=>{const declarations=[];for(const item of body.split(';')){if(!item.trim())continue;const m=/^\s*(border-radius|border-color|font-size)\s*:\s*([^;]+?)\s*$/.exec(item);if(!m)throw Error('Scoped CSS supports border-radius, border-color and font-size only.');const prop=m[1],v=m[2];if(prop==='border-color'?!/^#[0-9a-f]{6}$/i.test(v):!/^\d{1,2}px$/.test(v)||(prop==='border-radius'?(parseInt(v)>24):(parseInt(v)<12||parseInt(v)>22)))throw Error('Use hex border colors, radius 0–24px and font size 12–22px.');declarations.push(prop+':'+v);}if(!declarations.length)throw Error('Add a supported declaration inside each rule.');rules.push(selectors['.'+name]+'{'+declarations.join(';')+'}');return '';});for(const raw of rest.split(';')){if(!raw.trim())continue;const m=/^\s*--([a-z-]+)\s*:\s*(#[0-9a-f]{6})\s*$/i.exec(raw);if(!m||!Object.hasOwn(themeDefaults,m[1])||Object.hasOwn(tokens,m[1]))throw Error('Unsupported CSS. Use listed color tokens or .card, .message, .button rules only. No imports, URLs or other selectors.');tokens[m[1]]=m[2];}return {tokens,style:rules.join('\n')};}
function paintTheme(t){for(const [k,v] of Object.entries(t.tokens))document.documentElement.style.setProperty('--'+k,v);let style=document.getElementById('personal-theme-style');if(!style){style=document.createElement('style');style.id='personal-theme-style';document.head.append(style);}style.textContent=parsePersonalCSS(t.css).style;}

try{const raw=localStorage.getItem(appearanceKey);if(raw){if(raw.length>70000)throw Error();const saved=JSON.parse(raw);if(saved.version!==1||!Array.isArray(saved.palettes)||saved.palettes.length>12)throw Error();const nextApplied=validateTheme(saved.applied),nextPalettes=saved.palettes.map(validateTheme);appliedTheme=nextApplied;personalPalettes=nextPalettes;paintTheme(appliedTheme);}}catch{storageWarning='Personal appearance could not be loaded. The default palette is still available.';}
function themePreview(id){const a=themeArtifacts.get(id);if(!a||a.chat!==current.id)return '';return `<article class="artifact"><div class="artifact-top"><div><h3>Personal theme</h3><span class="small">${esc(id)} · simulated preview</span></div><span class="badge">${JSON.stringify(a.theme)===JSON.stringify(appliedTheme)?'APPLIED':'PREVIEW'}</span></div><div class="artifact-body"><h2>${esc(a.theme.name)}</h2><div style="display:flex;gap:10px;margin:18px 0">${['primary','accent','canvas','ink'].map(k=>`<span style="background:${a.theme.tokens[k]};width:44px;height:44px;border:1px solid var(--line);border-radius:8px" title="${esc(k)} ${a.theme.tokens[k]}"></span>`).join('')}</div><p>A personal palette. Open it to refine the colors and apply it when you are ready.</p></div><div class="artifact-footer"><span class="small">No workspace settings changed</span><button data-theme-open="${esc(id)}">Open editor ↗</button></div></article>`;}
function appearanceMarkup(){const d=appearanceDraft;return `<section id="appearance"><h2>Appearance</h2><p><button data-theme-chat>Create with chat ↗</button> <span class="small">Simulated theme assistant</span></p><p>Your palette, across this browser. Preview changes now; Apply saves them. The organization’s default stays unchanged.</p><label for="palette-choice">Saved palettes</label><select id="palette-choice"><option value="">Choose a palette…</option><option value="default">Northstar default</option>${personalPalettes.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('')}</select><label for="theme-name">Palette name</label><input id="theme-name" maxlength="80" value="${esc(d.name)}"><div class="theme-colors">${['primary','accent','canvas','ink'].map(k=>`<label>${{primary:'Navigation & buttons',accent:'Accent & focus',canvas:'Page background',ink:'Text'}[k]}<input type="color" data-theme-token="${k}" value="${d.tokens[k]}"></label>`).join('')}</div><details style="margin-top:20px"><summary>Advanced · custom CSS</summary><label for="theme-css">Custom CSS (optional)</label><textarea id="theme-css" rows="5" maxlength="4096" spellcheck="false" placeholder=".card { border-radius: 18px; }">${esc(d.css)}</textarea><p class="small">Supported CSS: .card, .message, .button { border-radius: 0–24px; border-color: #RRGGBB; font-size: 12–22px; }. Rules affect chat content only, not navigation or receipt indicators. You can also set color tokens: ${Object.keys(themeDefaults).map(k=>'--'+k).join(', ')}. No other selectors or properties, URLs, imports, functions or remote resources. Invalid input is rejected in full.</p></details><div id="theme-error" role="alert"></div><div class="notice">Preview your changes before applying. You can return to the default at any time.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" data-theme-apply>Apply personal theme</button><button data-theme-cancel>Cancel preview</button><button data-theme-reset>Reset to default</button></div></section>`;}
function mountAppearance(){appearanceDraft=appearanceDraft||structuredClone(appliedTheme);$('#main .settings').insertAdjacentHTML('beforeend',appearanceMarkup());}
function readAppearance(){appearanceDraft.name=$('#theme-name').value;appearanceDraft.css=$('#theme-css').value;for(const input of document.querySelectorAll('[data-theme-token]'))appearanceDraft.tokens[input.dataset.themeToken]=input.value;return validateTheme(appearanceDraft);}
function previewAppearance(){try{const next=readAppearance();paintTheme(next);$('#theme-error').textContent='';}catch(e){paintTheme(appliedTheme);$('#theme-error').textContent=e.message;}}
function renderThemeEditor(id){const a=themeArtifacts.get(id);if(!a){toast('This theme preview is unavailable.');navigate('#page/settings');return;}const chat=chats.find(c=>c.id===a.chat);if(!chat){navigate('#page/settings');return;}current=chat;org=chat.org;workspace=chat.workspace;sidebar();$('#composer-wrap').hidden=true;$('#work-mode').textContent='Personal theme';$('#breadcrumbs').innerHTML=`<a href="#chat/${esc(chat.id)}">${esc(chat.title)}</a><span>/</span>Theme editor`;appearanceDraft=structuredClone(a.theme);appearanceOrigin=id;$('#main').innerHTML=`<div class="settings"><div class="eyebrow">Theme ${esc(id)} · full-page editor</div><h1>${esc(a.theme.name)}</h1><p>Refine your simulated theme preview. Applying changes only your personal appearance.</p>${appearanceMarkup()}<p><a href="#chat/${esc(chat.id)}">← Back to conversation</a></p></div>`;renderDrawer();$('#theme-name').focus();}
function generateTheme(text){const last=[...themeArtifacts.values()].filter(a=>a.chat===current.id).at(-1);const t=structuredClone(last?.theme||appliedTheme);let pair=null,name=null;if(/purple|violet/i.test(text)){pair=['#493269','#9b6ac4'];name='Violet studio';}else if(/green|forest/i.test(text)){pair=['#204e43','#398770'];name='Forest focus';}else if(/warm|amber/i.test(text)){pair=['#64452d','#b77b36'];name='Warm amber';}else if(/ocean|blue|cool/i.test(text)||!last){pair=['#064273','#1da2d8'];name='Ocean calm';}if(pair){t.name=name;t.tokens.primary=pair[0];t.tokens['primary-hover']=pair[0];t.tokens.accent=pair[1];}if(/round/i.test(text))t.css+=(t.css.trim()?'\n':'')+'.card { border-radius: 18px; }';const id='theme-'+(++themeSequence);themeArtifacts.set(id,{chat:current.id,theme:t});return id;}

document.addEventListener('input',e=>{if(e.target.id==='theme-name'||e.target.id==='theme-css'||e.target.dataset.themeToken){previewAppearance();}});
document.addEventListener('change',e=>{if(e.target.id==='palette-choice'){const v=e.target.value;if(!v)return;appearanceDraft=structuredClone(v==='default'?{name:'Northstar default',tokens:{...themeDefaults},css:''}:personalPalettes[Number(v)]);$('#appearance').outerHTML=appearanceMarkup();previewAppearance();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.themeOpen)navigate('#theme/'+b.dataset.themeOpen);if(b.hasAttribute('data-theme-chat')){const c={id:'theme-chat-'+Date.now()+'-'+(++newCount),org:org==='All organizations'?current.org:org,workspace,project:null,title:'Personal appearance',subtitle:'Personal · theme conversation',messages:[]};chats.unshift(c);current=c;org=c.org;drawerOpen=false;navigate('#chat/'+c.id);send('Create a theme for me');}if(b.hasAttribute('data-theme-reset')){appearanceDraft={name:'Northstar default',tokens:{...themeDefaults},css:''};$('#appearance').outerHTML=appearanceMarkup();previewAppearance();}if(b.hasAttribute('data-theme-cancel')){paintTheme(appliedTheme);appearanceDraft=structuredClone(appearanceOrigin?themeArtifacts.get(appearanceOrigin).theme:appliedTheme);$('#appearance').outerHTML=appearanceMarkup();toast('Preview cancelled. Your applied palette is unchanged.');}if(b.hasAttribute('data-theme-apply')){try{const next=readAppearance(),palettes=[next,...personalPalettes.filter(t=>t.name!==next.name)].slice(0,12);localStorage.setItem(appearanceKey,JSON.stringify({version:1,applied:next,palettes}));appliedTheme=next;personalPalettes=palettes;paintTheme(next);if(appearanceOrigin)themeArtifacts.get(appearanceOrigin).theme=structuredClone(next);toast('Personal theme saved in this browser.');}catch(e){$('#theme-error').textContent='Not applied. '+e.message;paintTheme(appliedTheme);}}});

parkDrawer();window.addEventListener('hashchange',route);route();if(storageWarning)toast(storageWarning);
</script></body></html>
